<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Madden Startup Franchise Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  if (window.tailwind) tailwind.config = {
    theme: { extend: {
      colors: { bg: 'var(--bg)', panel: 'var(--panel)', panel2: 'var(--panel-2)', ink: 'var(--ink)', muted: 'var(--muted)', line: 'var(--line)', navy: 'var(--navy)', gold: 'var(--gold)', off: 'var(--off)', def: 'var(--def)', bench: 'var(--bench)' },
      fontFamily: { display: ['"Saira Condensed"', '"Arial Narrow"', 'sans-serif'], body: ['Barlow', 'system-ui', 'sans-serif'] }
    } }
  };
</script>
<style>
  :root {
    --bg: #e8ecf1; --panel: #ffffff; --panel-2: #f2f5f8; --ink: #17202c; --muted: #5a6677; --line: #d3dae3;
    --navy: #14213d; --navy-ink: #f4f6fa; --gold: #f2a900; --gold-ink: #1d1500;
    --off: #2a5bd7; --def: #c2412d; --bench: #5b6472; --ok: #1d7f47; --warn: #b45309;
    --shadow: 0 1px 0 rgba(20, 33, 61, .08);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101824; --panel: #172130; --panel-2: #1e2a3a; --ink: #e5eaf1; --muted: #93a0b3; --line: #2a374a;
      --navy: #0a1322; --navy-ink: #eef2f8; --gold: #ffbf1f; --gold-ink: #1d1500;
      --off: #79a2ff; --def: #ff8069; --bench: #a2acbb; --ok: #4cc983; --warn: #f5a524;
      --shadow: 0 1px 0 rgba(0, 0, 0, .3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #101824; --panel: #172130; --panel-2: #1e2a3a; --ink: #e5eaf1; --muted: #93a0b3; --line: #2a374a;
    --navy: #0a1322; --navy-ink: #eef2f8; --gold: #ffbf1f; --gold-ink: #1d1500;
    --off: #79a2ff; --def: #ff8069; --bench: #a2acbb; --ok: #4cc983; --warn: #f5a524;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body { background: var(--bg); color: var(--ink); font-family: Barlow, system-ui, sans-serif; margin: 0; }
  .num { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--off); outline-offset: 2px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; font-weight: 600; border-radius: 6px; padding: .5rem .9rem; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; font-size: .9rem; }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }
  :root[data-theme="dark"] .btn-primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); } }
  .btn-gold { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
  .btn-sm { padding: .25rem .6rem; font-size: .8rem; }
  .field { width: 100%; min-width: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: .5rem .65rem; color: var(--ink); font: inherit; }
  .field:focus { outline: none; border-color: var(--off); }
  .lbl { display: block; font-weight: 600; font-size: .85rem; margin-bottom: .3rem; }
  .hint { color: var(--muted); font-size: .8rem; }
  input[type=range] { accent-color: var(--off); width: 100%; }

  /* Broadcast ticker: the one loud element */
  .ticker { background: var(--navy); color: var(--navy-ink); }
  .ticker-scroll { display: flex; align-items: stretch; overflow-x: auto; scrollbar-width: thin; }
  .tk { flex: none; padding: .45rem .8rem; border-right: 1px solid rgba(255,255,255,.08); font-size: .82rem; white-space: nowrap; line-height: 1.15; }
  .tk .k { font-family: "Saira Condensed", sans-serif; font-weight: 700; opacity: .7; margin-right: .35rem; }
  .tk-past { opacity: .62; }
  .tk-now { flex: none; white-space: nowrap; background: var(--gold); color: var(--gold-ink); font-family: "Saira Condensed", sans-serif; font-size: 1.05rem; font-weight: 800; padding: .35rem 1rem; display: flex; align-items: center; gap: .6rem; }
  .tk-round { flex: none; align-self: center; font-family: "Saira Condensed", sans-serif; font-weight: 700; font-size: .75rem; color: var(--gold); padding: 0 .6rem; }

  /* Position magnets */
  .pos { display: inline-block; min-width: 2.6rem; text-align: center; font-family: "Saira Condensed", sans-serif; font-weight: 700; font-size: .8rem; padding: .05rem .35rem; border-radius: 4px; color: #fff; }
  .pos-OFF { background: var(--off); } .pos-DEF { background: var(--def); }
  :root[data-theme="dark"] .pos { color: #0b1220; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pos { color: #0b1220; } }
  .ovr { display: inline-block; min-width: 2.2rem; text-align: center; font-family: "Saira Condensed", sans-serif; font-weight: 800; font-size: .95rem; border-radius: 4px; padding: 0 .3rem; }
  .ovr-elite { background: var(--gold); color: var(--gold-ink); }
  .ovr-good { background: var(--panel-2); border: 1px solid var(--line); }
  .ovr-mid { color: var(--ink); }
  .ovr-low { color: var(--muted); }

  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: .2rem .65rem; font-size: .8rem; font-weight: 600; cursor: pointer; color: var(--ink); white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .chip .need { font-size: .7rem; margin-left: .25rem; color: var(--warn); }
  .chip[aria-pressed="true"] .need { color: var(--gold); }

  .pool-table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  .pool-table th { position: sticky; top: 0; background: var(--panel); text-align: left; font-size: .75rem; color: var(--muted); font-weight: 600; padding: .5rem .5rem; border-bottom: 1px solid var(--line); z-index: 1; }
  .pool-table td { padding: .4rem .5rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .pool-table tr:hover td { background: var(--panel-2); }
  .pool-table tr.nofit td { opacity: .5; }

  /* Depth chart magnets */
  .slot { display: grid; grid-template-columns: 3.1rem 1fr auto; align-items: center; gap: .4rem; padding: .3rem .45rem; border-radius: 6px; background: var(--panel-2); border-left: 4px solid var(--bench); min-height: 2.1rem; font-size: .85rem; }
  .slot.open { background: transparent; border: 1px dashed var(--line); border-left-width: 4px; color: var(--muted); }
  .slot.u-OFF { border-left-color: var(--off); } .slot.u-DEF { border-left-color: var(--def); } .slot.u-BENCH { border-left-color: var(--bench); }
  .slot .l { font-family: "Saira Condensed", sans-serif; font-weight: 700; font-size: .78rem; color: var(--muted); }
  .slot .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .slot.open .n { font-weight: 400; font-style: italic; }
  .slot.fresh { animation: snap .6s ease-out; }
  @keyframes snap { from { transform: translateX(-6px); background: var(--gold); } to { transform: none; } }

  .board { border-collapse: separate; border-spacing: 3px; font-size: .75rem; }
  .board th { font-family: "Saira Condensed", sans-serif; font-weight: 700; font-size: .78rem; min-width: 7.5rem; max-width: 7.5rem; padding: .3rem; text-align: left; position: sticky; top: 0; background: var(--panel); z-index: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .board td.rd { font-family: "Saira Condensed", sans-serif; font-weight: 700; color: var(--muted); padding-right: .3rem; white-space: nowrap; position: sticky; left: 0; background: var(--panel); }
  .bc { background: var(--panel-2); border-radius: 4px; padding: .25rem .35rem; min-height: 2.4rem; max-width: 7.5rem; border-left: 3px solid transparent; }
  .bc.u-OFF { border-left-color: var(--off); } .bc.u-DEF { border-left-color: var(--def); }
  .bc .bn { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bc.now { outline: 2px solid var(--gold); background: transparent; }
  .bc.empty { background: transparent; border: 1px dashed var(--line); }

  .live-dot { width: .55rem; height: .55rem; border-radius: 999px; display: inline-block; background: var(--muted); }
  .live-dot.on { background: var(--ok); }
  .yourpick { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(242,169,0,.0); } 50% { box-shadow: 0 0 0 6px rgba(242,169,0,.35); } }
  @media (prefers-reduced-motion: reduce) { .yourpick, .slot.fresh { animation: none; } }
  .toast { position: fixed; left: 50%; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); color: var(--navy-ink); padding: .6rem 1rem; border-radius: 8px; font-weight: 600; z-index: 50; max-width: 92vw; }
  .toast.err { background: var(--def); color: #fff; }
  .modal-bg { position: fixed; inset: 0; background: rgba(8, 14, 24, .55); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .scroll-y { overflow-y: auto; }
  .tabbtn { font-family: "Saira Condensed", sans-serif; font-weight: 700; font-size: 1.05rem; padding: .35rem .2rem; border-bottom: 3px solid transparent; color: var(--muted); background: none; cursor: pointer; }
  .tabbtn[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
  .hero-h { font-family: "Saira Condensed", sans-serif; font-weight: 800; line-height: .92; letter-spacing: -.01em; font-size: clamp(2.6rem, 6vw, 4.4rem); }
  .bar { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--gold); }
</style>
</head>
<body>
<div id="hdr"></div>
<div id="root"></div>
<div id="overlay"></div>
<script src="shared/draft-engine.js"></script>
<script src="shared/player-data.js"></script>
<script>
(() => {
'use strict';
const E = window.DraftEngine;
const PD = window.MaddenPlayerData;
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage full or blocked */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
};
const LOCAL_KEY = 'msfd:local:v1';
const ONLINE_KEY = 'msfd:online:v1';
const UNIT = {};
E.OFF.forEach(p => { UNIT[p] = 'OFF'; });
E.DEF.forEach(p => { UNIT[p] = 'DEF'; });

const app = {
  screen: 'setup', mode: null, state: null,
  pool: [], poolMap: {}, poolSource: 'built-in', customPool: null,
  myTeams: [], viewTeam: null, tab: 'pool',
  filters: { q: '', pos: 'ALL', team: 'ALL', sort: 'adp', fit: true }, limit: 150,
  serverAvailable: false, serverPool: null, socket: null, connected: false,
  room: null, token: null, memberId: null, members: [], isHost: false,
  deadline: null, botTimer: null, tick: null, lastOnClock: null, freshSlot: null,
  setupTab: 'local',
  setup: { numTeams: 12, humans: 1, names: ['My Franchise'], seed: E.randomSeed(), pickTimer: 0, botDelay: 500, onlineName: '', joinCode: '', onlineHumans: 4 }
};

// ---------- Utilities ----------
function setPool(pool, source) { app.pool = pool; app.poolMap = E.indexPool(pool); app.poolSource = source; }
function team(id) { return app.state ? E.getTeam(app.state, id) : null; }
function player(id) { return app.poolMap[id]; }
function ovrClass(o) { return o >= 90 ? 'ovr-elite' : o >= 80 ? 'ovr-good' : o >= 70 ? 'ovr-mid' : 'ovr-low'; }
function posTag(p) { return `<span class="pos pos-${UNIT[p.pos]}">${esc(p.detail)}</span>`; }
function shortName(n) { const parts = n.split(' '); return parts.length > 1 ? parts[0][0] + '. ' + parts.slice(1).join(' ') : n; }
function ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function fmt(v) { return v == null ? '–' : Number(v).toFixed(1); }
function teamLabel(t) { return t ? (t.isBot ? '🤖 ' : '') + t.name : ''; }
let toastTimer = null;
function toast(msg, kind) {
  let el = $('#toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.className = 'toast' + (kind === 'err' ? ' err' : '');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}
function isMine(teamId) { return app.myTeams.indexOf(teamId) >= 0; }
function onClock() { return app.state ? E.onClock(app.state) : null; }
// The team whose needs drive the pool view and the Draft buttons.
function draftingFor() {
  const oc = onClock();
  if (oc && isMine(oc.teamId)) return team(oc.teamId);
  return app.myTeams.length ? team(app.myTeams[0]) : null;
}
function canActNow() {
  const oc = onClock();
  return !!(oc && !app.state.paused && isMine(oc.teamId));
}

// ---------- Theme ----------
function applyTheme(t) {
  if (t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}
applyTheme(LS.get('msfd:theme'));
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') ||
    (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next); LS.set('msfd:theme', next);
}

// ---------- Header ----------
function renderHeader() {
  const s = app.state;
  let right = '';
  if (app.mode === 'online' && app.room) {
    right += `<span class="flex items-center gap-1.5 text-sm"><span class="live-dot ${app.connected ? 'on' : ''}"></span>${app.connected ? 'Live' : 'Reconnecting'}</span>
      <span class="text-sm">Room <b class="font-display text-base tracking-wide">${esc(app.room)}</b></span>`;
  } else if (app.mode === 'local') {
    right += `<span class="text-sm text-muted hidden sm:inline">Solo / couch draft</span>`;
  }
  if (s && app.screen !== 'setup') right += `<span class="text-sm text-muted hidden sm:inline">Seed <b class="text-ink">${esc(s.seed)}</b></span>`;
  $('#hdr').innerHTML = `
  <header class="border-b border-line bg-panel">
    <div class="max-w-[1500px] mx-auto px-4 py-2.5 flex items-center gap-4">
      <div class="flex items-baseline gap-2 min-w-0">
        <span class="font-display font-extrabold text-xl sm:text-2xl leading-none">Startup Franchise Draft</span>
        <span class="text-muted text-sm hidden md:inline">25 rounds, snake order</span>
      </div>
      <div class="ml-auto flex items-center gap-3">${right}
        <button class="btn btn-sm" data-action="theme" aria-label="Switch light or dark theme">◐</button>
      </div>
    </div>
  </header>`;
}

// ---------- Setup screen ----------
function templatePreview() {
  const groups = [['OFF', 'Offense, 12'], ['DEF', 'Defense, 11'], ['BENCH', 'Backups, 2']];
  return groups.map(([u, title]) => `
    <div>
      <div class="font-display font-bold text-lg mb-1.5">${title}</div>
      <div class="grid grid-cols-3 sm:grid-cols-4 gap-1.5">
        ${E.SLOTS.filter(s => s.unit === u).map(s => `<div class="slot u-${u} open !grid-cols-1 !min-h-0 py-1"><span class="l">${esc(s.label)}</span></div>`).join('')}
      </div>
    </div>`).join('');
}

function renderSetup() {
  const st = app.setup;
  const saved = LS.get(LOCAL_KEY);
  const savedInfo = saved && saved.state && saved.state.status !== 'lobby'
    ? (saved.state.status === 'complete' ? 'Finished draft' : `Round ${E.pickInfo(saved.state, saved.state.currentPick).round}, pick ${saved.state.currentPick + 1} overall`) : null;
  const names = [];
  for (let i = 0; i < st.humans; i++) {
    names.push(`<input class="field" data-name-idx="${i}" maxlength="32" value="${esc(st.names[i] || '')}" placeholder="Drafter ${i + 1} team name" aria-label="Drafter ${i + 1} team name">`);
  }
  const timerOpts = [[0, 'No clock'], [30, '30 seconds'], [60, '60 seconds'], [90, '90 seconds'], [120, '2 minutes']];
  const speedOpts = [[80, 'Instant'], [500, 'Fast'], [1200, 'Normal'], [2500, 'Slow']];
  const opt = (list, val) => list.map(([v, l]) => `<option value="${v}" ${Number(val) === v ? 'selected' : ''}>${l}</option>`).join('');
  const poolLine = app.customPool
    ? `Custom pool loaded: <b>${app.customPool.length}</b> players. <button class="underline" data-action="clear-pool">Use built-in pool</button>`
    : `Built-in pool: <b>${(app.serverPool || app.pool).length}</b> players.`;

  const localForm = `
    <div class="space-y-4">
      <div>
        <label class="lbl" for="numTeams">Teams in the draft: <span id="numTeamsVal" class="num">${st.numTeams}</span></label>
        <input id="numTeams" type="range" min="2" max="32" value="${st.numTeams}" data-bind="numTeams">
      </div>
      <div>
        <label class="lbl" for="humans">Human drafters</label>
        <input id="humans" class="field w-28" type="number" min="0" max="${st.numTeams}" value="${st.humans}" data-bind="humans">
        <p class="hint mt-1">Bots fill the other ${Math.max(0, st.numTeams - st.humans)} teams. Set 0 to watch an all-bot mock. More than one human means you pass the device.</p>
      </div>
      ${st.humans ? `<div><span class="lbl">Team names</span><div class="grid sm:grid-cols-2 gap-2 max-h-48 scroll-y pr-1">${names.join('')}</div></div>` : ''}
      <div class="grid sm:grid-cols-2 gap-4">
        <div><label class="lbl" for="pickTimer">Pick clock</label><select id="pickTimer" class="field" data-bind="pickTimer">${opt(timerOpts, st.pickTimer)}</select></div>
        <div><label class="lbl" for="botDelay">Bot speed</label><select id="botDelay" class="field" data-bind="botDelay">${opt(speedOpts, st.botDelay)}</select></div>
      </div>
      <div>
        <label class="lbl" for="seed">Draft order seed</label>
        <div class="flex gap-2"><input id="seed" class="field" data-bind="seed" value="${esc(st.seed)}" maxlength="40"><button class="btn" data-action="dice" aria-label="New random seed">🎲</button></div>
        <p class="hint mt-1">Same seed and settings give the same draft order and the same bot picks.</p>
      </div>
      <div class="text-sm">
        <p>${poolLine}</p>
        <label class="btn btn-sm mt-2 cursor-pointer">Load player JSON<input type="file" accept=".json,application/json" class="hidden" data-action="pool-file"></label>
        <p class="hint mt-1">Array of {name, team, pos, ovr, adp?}. Positions like QB, HB, LT, RG, DE, DT, MLB, CB, FS work.</p>
      </div>
      <div class="flex flex-wrap gap-2 pt-1">
        <button class="btn btn-primary" data-action="start-local">Start draft</button>
        ${savedInfo ? `<button class="btn" data-action="resume-local">Resume saved draft (${esc(savedInfo)})</button><button class="btn btn-sm" data-action="discard-local">Discard save</button>` : ''}
      </div>
    </div>`;

  const onlineForm = app.serverAvailable ? `
    <div class="space-y-6">
      <div class="space-y-3">
        <div class="font-display font-bold text-lg">Create a room</div>
        <div><label class="lbl" for="oname">Your name</label><input id="oname" class="field" data-bind="onlineName" maxlength="32" value="${esc(st.onlineName)}" placeholder="Commissioner"></div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="lbl" for="onumTeams">Teams</label><input id="onumTeams" type="number" min="2" max="32" class="field" data-bind="numTeams" value="${st.numTeams}"></div>
          <div><label class="lbl" for="ohumans">Human seats</label><input id="ohumans" type="number" min="1" max="${st.numTeams}" class="field" data-bind="onlineHumans" value="${st.onlineHumans}"></div>
          <div><label class="lbl" for="otimer">Pick clock</label><select id="otimer" class="field" data-bind="pickTimer">${opt(timerOpts, st.pickTimer)}</select></div>
          <div><label class="lbl" for="obot">Bot speed</label><select id="obot" class="field" data-bind="botDelay">${opt(speedOpts, st.botDelay)}</select></div>
        </div>
        <div><label class="lbl" for="oseed">Seed</label><div class="flex gap-2"><input id="oseed" class="field" data-bind="seed" value="${esc(st.seed)}"><button class="btn" data-action="dice" aria-label="New random seed">🎲</button></div></div>
        <p class="hint">Open human seats that nobody claims become bots when you start.</p>
        <button class="btn btn-primary" data-action="create-room">Create room</button>
      </div>
      <div class="space-y-3 border-t border-line pt-5">
        <div class="font-display font-bold text-lg">Join a room</div>
        <div class="grid grid-cols-[1fr_8rem] gap-2">
          <input class="field" data-bind="onlineName" value="${esc(st.onlineName)}" placeholder="Your name" aria-label="Your name" maxlength="32">

// ---------- Local (solo / couch) mode ----------
function startLocal() {
  const st = app.setup;
  const pool = app.customPool || app.serverPool || PD.buildPool();
  const check = E.validatePool(pool, st.numTeams);
  if (!check.ok) { toast('Pool too small: ' + check.problems[0], 'err'); return; }
  setPool(pool, app.customPool ? 'custom' : 'built-in');
  const names = [];
  for (let i = 0; i < st.humans; i++) names.push((st.names[i] || '').trim() || (st.humans === 1 ? 'My Franchise' : 'Drafter ' + (i + 1)));
  const state = E.createSession({ numTeams: st.numTeams, humanSlots: st.humans, humanNames: names, seed: st.seed.trim() || E.randomSeed(), pickTimer: st.pickTimer, botDelayMs: st.botDelay });
  E.startDraft(state);
  enterLocal(state);
}
function enterLocal(state) {
  app.mode = 'local';
  app.state = state;
  app.myTeams = state.teams.filter(t => !t.isBot).map(t => t.id);
  app.viewTeam = app.myTeams[0] || state.order[0];
  app.screen = 'draft';
  render();
  scheduleLocal();
  saveLocal();
}
function saveLocal() {
  LS.set(LOCAL_KEY, { state: app.state, poolSource: app.poolSource, customPool: app.poolSource === 'custom' ? app.pool : null });
}
function resumeLocal() {
  const saved = LS.get(LOCAL_KEY);
  if (!saved || !saved.state) return;
  setPool(saved.customPool || app.serverPool || PD.buildPool(), saved.customPool ? 'custom' : 'built-in');
  enterLocal(saved.state);
}
function scheduleLocal() {
  clearTimeout(app.botTimer);
  app.deadline = null;
  const s = app.state;
  if (!s || s.status !== 'drafting' || s.paused) return;
  const oc = E.onClock(s);
  const t = team(oc.teamId);
  if (t.isBot) app.botTimer = setTimeout(() => localAuto('bot'), s.config.botDelayMs);
  else if (s.config.pickTimer > 0) {
    app.deadline = Date.now() + s.config.pickTimer * 1000;
    app.botTimer = setTimeout(() => localAuto('timer'), s.config.pickTimer * 1000);
  }
}
function localAuto(by) {
  const s = app.state;
  if (!s || s.status !== 'drafting') return;
  const oc = E.onClock(s);
  const id = E.botChoose(s, app.pool, app.poolMap, oc.teamId);
  if (!id) { s.paused = true; toast('No legal player is left for this team. The draft is paused.', 'err'); return afterLocal(); }
  const pick = E.makePick(s, app.poolMap, id, { by, force: true });
  if (by === 'timer' || by === 'auto') toast(`Auto-picked ${player(id).name} for ${team(oc.teamId).name}`);
  markFresh(pick);
  afterLocal();
}
function afterLocal() { saveLocal(); updateDraft(); scheduleLocal(); }

// ---------- Online mode ----------
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
async function detectServer() {
  if (window.MSFD_STANDALONE || !/^https?:$/.test(location.protocol)) return false;
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 1500);
    const r = await fetch('/api/health', { signal: ctl.signal });
    clearTimeout(timer);
    if (!r.ok) return false;
    const j = await r.json();
    if (!j.ok) return false;
    await loadScript('/socket.io/socket.io.js');
    const pool = await (await fetch('/api/pool')).json();
    app.serverPool = pool;
    setPool(pool, 'server');
    return typeof window.io === 'function';
  } catch (e) { return false; }
}
function connectSocket() {
  if (app.socket) return app.socket;
  const sock = window.io({ transports: ['websocket', 'polling'] });
  app.socket = sock;
  sock.on('connect', () => {
    app.connected = true;
    if (app.room && app.token) {
      sock.emit('room:join', { roomId: app.room, token: app.token }, res => {
        if (!res.ok) { toast(res.error, 'err'); leaveOnline(); return; }
        app.memberId = res.memberId;
        onView(res.view);
      });
    }
    renderHeader();
  });
  sock.on('disconnect', () => { app.connected = false; renderHeader(); });
  sock.on('state', onView);
  return sock;
}
function emit(evt, payload) {
  return new Promise(resolve => {
    app.socket.emit(evt, payload || {}, res => {
      if (res && !res.ok) toast(res.error, 'err');
      resolve(res || { ok: false });
    });
  });
}
function enterRoom(res) {
  app.mode = 'online';
  app.room = res.roomId; app.token = res.token; app.memberId = res.memberId;
  LS.set(ONLINE_KEY, { room: app.room, token: app.token });
  const u = new URL(location.href); u.searchParams.set('room', app.room); history.replaceState(null, '', u);
  onView(res.view);
}
async function createRoom() {
  const st = app.setup;
  connectSocket();
  const res = await emit('room:create', { name: st.onlineName || 'Commissioner', numTeams: st.numTeams, humanSlots: st.onlineHumans, seed: st.seed, pickTimer: st.pickTimer, botDelayMs: st.botDelay });
  if (res.ok) enterRoom(res);
}
async function joinRoom() {
  const st = app.setup;
  if (!st.joinCode) return toast('Enter the room code', 'err');
  connectSocket();
  const res = await emit('room:join', { roomId: st.joinCode, name: st.onlineName || 'Guest' });
  if (res.ok) enterRoom(res);
}
function leaveOnline() {
  if (app.socket) app.socket.emit('room:leave', {});
  LS.del(ONLINE_KEY);
  app.mode = null; app.room = null; app.token = null; app.state = null; app.myTeams = [];
  const u = new URL(location.href); u.searchParams.delete('room'); history.replaceState(null, '', u);
  app.screen = 'setup';
  render();
}
function onView(view) {
  const prevCount = app.state ? app.state.picks.length : 0;
  app.state = view.state;
  app.members = view.members;
  const offset = view.serverNow - Date.now();
  app.deadline = view.deadline ? view.deadline - offset : null;
  const me = view.members.find(m => m.id === app.memberId);
  app.isHost = !!(me && me.isHost);
  app.myTeams = me && me.teamId ? [me.teamId] : [];
  if (!app.viewTeam || !team(app.viewTeam)) app.viewTeam = app.myTeams[0] || 'T1';
  if (app.state.picks.length > prevCount) markFresh(app.state.picks[app.state.picks.length - 1]);
  const next = app.state.status === 'lobby' ? 'lobby' : 'draft';
  if (app.screen !== next || next === 'lobby') { app.screen = next; render(); }
  else updateDraft();
}

function updateDraft() {
  if (app.screen !== 'draft' || !$('#ticker')) return;
  renderTicker(); renderClock(); renderRecent(); renderChips(); renderPool(); renderRoster(); renderComplete();
  if (app.tab === 'board') renderBoard();
  renderHeader();
  const oc = onClock();
  const key = oc ? oc.overall : null;
  if (key !== app.lastOnClock) {
    app.lastOnClock = key;
    if (oc && isMine(oc.teamId) && !app.state.paused) {
      if (app.myTeams.length > 1) app.viewTeam = oc.teamId;
      document.title = '⏱ Your pick | Startup Franchise Draft';
      renderRoster();
    } else document.title = 'Madden Startup Franchise Draft';
  }
}

function renderTicker() {
  const s = app.state;
  const parts = [];
  s.picks.slice(-6).forEach(pk => {
    const p = player(pk.playerId); const t = team(pk.teamId);
    parts.push(`<div class="tk tk-past"><span class="k">#${pk.overall}</span>${esc(t.name)}<br><b>${esc(shortName(p.name))}</b> ${esc(p.detail)}</div>`);
  });
  const oc = onClock();
  if (oc) {
    parts.push(`<div class="tk-now" id="tk-now"><span>On the clock</span><span>${esc(team(oc.teamId).name)}</span><span class="num opacity-80">R${oc.round} P${oc.pickInRound}</span><span class="num" data-timer></span></div>`);
    let lastRound = oc.round;
    E.upcoming(s, 14).slice(1).forEach(u => {
      if (u.round !== lastRound) { parts.push(`<div class="tk-round">Round ${u.round} turns</div>`); lastRound = u.round; }
      const t = team(u.teamId);
      parts.push(`<div class="tk ${isMine(u.teamId) ? 'font-bold' : ''}"><span class="k">#${u.overall}</span>${isMine(u.teamId) ? '★ ' : ''}${esc(t.name)}</div>`);
    });
  } else if (s.status === 'complete') {
    parts.push(`<div class="tk-now">Draft complete</div>`);
  }
  const el = $('#ticker');
  el.innerHTML = parts.join('');
  const now = $('#tk-now');
  if (now) el.scrollLeft = Math.max(0, now.offsetLeft - Math.min(220, el.clientWidth * 0.15));
}

function renderClock() {
  const s = app.state;
  const oc = onClock();
  const total = E.totalPicks(s);
  const done = s.picks.length;
  let body;
  if (!oc) {
    body = `<div class="font-display font-extrabold text-3xl">Draft complete</div><p class="text-sm text-muted mt-1">${total} players drafted.</p>`;
  } else {
    const t = team(oc.teamId);
    const mine = isMine(oc.teamId);
    const owner = app.mode === 'online' ? app.members.find(m => m.teamId === oc.teamId) : null;
    let status;
    if (s.paused) status = `<span class="font-semibold" style="color:var(--warn)">Paused</span>`;
    else if (mine) status = `<span class="inline-block btn-gold rounded px-2 py-0.5 font-bold yourpick">Your pick${app.myTeams.length > 1 ? ': ' + esc(t.name) : ''}</span>`;
    else if (t.isBot) status = `<span class="text-muted">Bot is picking</span>`;
    else status = `<span class="text-muted">Waiting on ${esc(owner ? owner.name : t.name)}${owner && !owner.online ? ' (offline)' : ''}</span>`;
    const canControl = app.mode === 'local' || app.isHost;
    const buttons = [];
    if (canControl) buttons.push(`<button class="btn btn-sm" data-action="pause">${s.paused ? 'Resume' : 'Pause'}</button>`);
    if (mine || (app.mode === 'online' && app.isHost && !t.isBot)) buttons.push(`<button class="btn btn-sm" data-action="autopick" ${s.paused && app.mode === 'online' ? 'disabled' : ''}>Auto-pick</button>`);
    if (canControl && done > 0) buttons.push(`<button class="btn btn-sm" data-action="undo">Undo last pick</button>`);
    body = `
      <div class="text-sm text-muted">On the clock</div>
      <div class="font-display font-extrabold text-[1.7rem] leading-tight mt-0.5">${esc(teamLabel(t))}</div>
      <div class="text-sm mt-1">Round ${oc.round}, pick ${oc.pickInRound} <span class="text-muted">(${ordinal(oc.overall)} overall)</span></div>

  $('#clock').innerHTML = `${body}

    </div>`;
  renderTimer();

function renderTimer() {
  const els = document.querySelectorAll('[data-timer]');

  const left = Math.max(0, app.deadline - Date.now());

  if (bar) bar.style.width = (left / (app.state.config.pickTimer * 1000) * 100) + '%';

function filteredPool() {
  const f = app.filters;
  const q = f.q.trim().toLowerCase();
  const t = draftingFor();
  const drafted = app.state.drafted;
  let list = app.pool.filter(p => !drafted[p.id]);
  if (f.pos !== 'ALL') list = list.filter(p => p.pos === f.pos);
  if (f.team !== 'ALL') list = list.filter(p => p.team === f.team);
  if (q) list = list.filter(p => p.name.toLowerCase().indexOf(q) >= 0 || p.team.toLowerCase() === q || p.detail.toLowerCase() === q || p.pos.toLowerCase() === q);
  if (f.fit && t && app.state.status === 'drafting') list = list.filter(p => E.canDraft(t, p));
  if (f.sort === 'ovr') list.sort((a, b) => b.ovr - a.ovr || a.adp - b.adp);
  else if (f.sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
  else list.sort((a, b) => a.adp - b.adp);
  return list;
}

function renderPool() {
  const list = filteredPool();
  const t = draftingFor();
  const act = canActNow();
  const shown = list.slice(0, app.limit);
  $('#pool-body').innerHTML = shown.length ? shown.map(p => {
    const fits = t ? E.canDraft(t, p) : true;
    let btn = '';
    if (app.state.status === 'drafting' && t) {
      if (!fits) btn = `<span class="text-xs text-muted">No spot</span>`;
      else btn = `<button class="btn btn-sm ${act ? 'btn-primary' : ''}" data-action="draft" data-id="${esc(p.id)}" ${act ? '' : 'disabled'} aria-label="Draft ${esc(p.name)}">Draft</button>`;
    }
    return `<tr class="${fits ? '' : 'nofit'}">
      <td class="num text-muted">${p.adp}</td>
      <td><div class="font-semibold leading-tight">${esc(p.name)}</div><div class="text-xs text-muted sm:hidden">${esc(p.team)}</div></td>
      <td>${posTag(p)}</td>
      <td class="hidden sm:table-cell text-muted">${esc(p.team)}</td>
      <td><span class="ovr ${ovrClass(p.ovr)}">${p.ovr}</span></td>
      <td class="text-right">${btn}</td></tr>`;
  }).join('') : `<tr><td colspan="6" class="text-center py-8 text-muted">No players match. Clear the search or pick another position.</td></tr>`;
  $('#pool-foot').innerHTML = list.length > shown.length
    ? `Showing ${shown.length} of ${list.length}. <button class="underline" data-action="more">Show 150 more</button>`
    : `${list.length} player${list.length === 1 ? '' : 's'}`;
}

function renderRoster() {
  const s = app.state;
  if (!team(app.viewTeam)) app.viewTeam = s.order[0] || s.teams[0].id;
  const t = team(app.viewTeam);
  const sum = E.teamSummary(s, app.poolMap, t.id);
  const freshKey = app.freshSlot && app.freshSlot.teamId === t.id ? app.freshSlot.slot : null;
  const tile = (sl, i) => {
    const p = t.slots[i] && player(t.slots[i]);
    if (!p) return `<div class="slot u-${sl.unit} open"><span class="l">${esc(sl.label)}</span><span class="n">${sl.flex ? (sl.side === 'OFF' ? 'QB, RB, WR, TE, OL' : 'DL, LB, DB') : 'Open'}</span><span></span></div>`;
    return `<div class="slot u-${sl.unit} ${freshKey === sl.key ? 'fresh' : ''}" title="${esc(p.name)}, ${esc(p.detail)}, ${esc(p.team)}"><span class="l">${esc(sl.label)}</span><span class="n">${esc(p.name)}</span><span class="ovr ${ovrClass(p.ovr)}">${p.ovr}</span></div>`;
  };
  const unit = (u, title) => {
    const idx = E.SLOTS.map((sl, i) => [sl, i]).filter(([sl]) => sl.unit === u);
    const filled = idx.filter(([, i]) => t.slots[i]).length;
    return `<div class="mt-4"><div class="flex justify-between items-baseline mb-1.5"><h3 class="font-display font-bold text-lg">${title}</h3><span class="text-xs text-muted num">${filled} of ${idx.length}</span></div>
      <div class="grid grid-cols-1 gap-1">${idx.map(([sl, i]) => tile(sl, i)).join('')}</div></div>`;
  };
  const opts = s.teams.map(x => `<option value="${x.id}" ${x.id === t.id ? 'selected' : ''}>${isMine(x.id) ? '★ ' : ''}${esc(teamLabel(x))}</option>`).join('');
  const stat = (label, v) => `<div><div class="text-xs text-muted">${label}</div><div class="font-display font-extrabold text-xl num">${v == null ? '–' : (typeof v === 'number' ? v.toFixed(1) : v)}</div></div>`;
  $('#roster').innerHTML = `
    <label class="lbl" for="viewTeam">Depth chart</label>
    <select id="viewTeam" class="field" data-action="view-team">${opts}</select>
    <div class="grid grid-cols-4 gap-2 mt-3">${stat('Filled', sum.filled + '/25')}${stat('Starters', sum.starters)}${stat('Offense', sum.off)}${stat('Defense', sum.def)}</div>
    <div class="bar mt-2"><span style="width:${sum.filled / 25 * 100}%"></span></div>
    <div class="max-h-[calc(100vh-15rem)] scroll-y pr-1 -mr-1">
      ${unit('OFF', 'Offense')}${unit('DEF', 'Defense')}${unit('BENCH', 'Backups')}
    </div>
    ${t.isBot ? `<p class="hint mt-3">Bot style: ${esc(E.STRATEGIES[t.strategy].label.toLowerCase())}.</p>` : ''}`;
}

function renderBoard() {
  const s = app.state;
  const n = s.teams.length;
  const byOverall = {};
  s.picks.forEach(pk => { byOverall[pk.overall] = pk; });
  const head = s.order.map((id, i) => `<th title="${esc(team(id).name)}" class="${isMine(id) ? 'text-off' : ''}">${i + 1}. ${esc(team(id).name)}</th>`).join('');
  const cur = s.status === 'drafting' ? s.currentPick + 1 : -1;
  let rows = '';
  for (let r = 1; r <= E.ROUNDS; r++) {
    let cells = '';
    for (let c = 0; c < n; c++) {
      const idxInRound = r % 2 === 1 ? c : n - 1 - c;
      const overall = (r - 1) * n + idxInRound + 1;
      const pk = byOverall[overall];
      if (pk) {
        const p = player(pk.playerId);
        cells += `<td><div class="bc u-${UNIT[p.pos]}" title="${esc(p.name)}"><div class="bn">${esc(shortName(p.name))}</div><div class="flex justify-between text-muted"><span>${esc(p.detail)}</span><span class="num">${p.ovr}</span></div></div></td>`;
      } else {
        cells += `<td><div class="bc ${overall === cur ? 'now' : 'empty'}"><div class="text-muted num">${r}.${String(idxInRound + 1).padStart(2, '0')}</div></div></td>`;
      }
    }
    rows += `<tr><td class="rd">R${r} ${r % 2 === 1 ? '→' : '←'}</td>${cells}</tr>`;
  }
  $('#board').innerHTML = `<table class="board"><thead><tr><th class="!min-w-0"></th>${head}</tr></thead><tbody>${rows}</tbody></table>`;
}

function renderComplete() {
  const s = app.state;
  const el = $('#complete');
  if (s.status !== 'complete') { el.innerHTML = ''; return; }
  const table = E.leagueTable(s, app.poolMap);
  el.innerHTML = `
    <div class="p-4 border-b border-line">
      <div class="flex flex-wrap items-baseline gap-3 justify-between">
        <h2 class="font-display font-extrabold text-3xl">Final grades</h2>
        <span class="hint">Grades rank each team by average starter rating.</span>
      </div>
      <div class="overflow-x-auto mt-3 max-h-72 scroll-y">
        <table class="pool-table"><thead><tr><th>Rank</th><th>Team</th><th>Grade</th><th>Starters</th><th>Offense</th><th>Defense</th></tr></thead>
        <tbody>${table.map(r => `<tr class="${isMine(r.teamId) ? 'font-bold' : ''}"><td class="num">${r.rank}</td><td><button class="underline-offset-2 hover:underline text-left" data-action="show-team" data-team="${r.teamId}">${esc(r.isBot ? '🤖 ' + r.name : r.name)}</button></td><td><span class="ovr ${r.rank <= Math.ceil(table.length / 10) ? 'ovr-elite' : 'ovr-good'}">${r.grade}</span></td><td class="num">${fmt(r.starters)}</td><td class="num">${fmt(r.off)}</td><td class="num">${fmt(r.def)}</td></tr>`).join('')}</tbody></table>
      </div>
    </div>`;
}

function markFresh(pick) {
  app.freshSlot = { teamId: pick.teamId, slot: pick.slot };
  setTimeout(() => { if (app.freshSlot && app.freshSlot.slot === pick.slot && app.freshSlot.teamId === pick.teamId) app.freshSlot = null; }, 900);
}

// ---------- Actions ----------
function draftPlayer(id) {
  const oc = onClock();
  if (!oc || !isMine(oc.teamId)) return;
  const p = player(id);
  if (app.mode === 'local') {
    try {
      const pick = E.makePick(app.state, app.poolMap, id, { teamId: oc.teamId, by: 'human' });
      markFresh(pick);
      app.viewTeam = oc.teamId;
      toast(`Drafted ${p.name} into ${E.SLOTS.find(s => s.key === pick.slot).label}`);
      afterLocal();
    } catch (e) { toast(e.message, 'err'); }
  } else {
    app.viewTeam = oc.teamId;
    emit('draft:pick', { playerId: id }).then(res => { if (res.ok) toast(`Drafted ${p.name}`); });
  }
}

function showExport() {
  const data = JSON.stringify(E.exportResults(app.state, app.poolMap), null, 2);
  const serverLink = app.mode === 'online' ? `<a class="btn btn-sm" href="/api/sessions/${esc(app.room)}/export" download>Download file</a>` : '';
  $('#overlay').innerHTML = `
    <div class="modal-bg" data-action="close-modal">
      <div class="card p-5 w-full max-w-2xl" role="dialog" aria-modal="true" aria-label="Export results">
        <div class="flex justify-between items-center mb-3"><h2 class="font-display font-extrabold text-2xl">Export results</h2><button class="btn btn-sm" data-action="close-modal">Close</button></div>
        <p class="hint mb-2">Draft order, every pick, all 25-man rosters, and grades as JSON.</p>
        <textarea id="export-text" class="field font-mono text-xs h-80" readonly>${esc(data)}</textarea>
        <div class="flex gap-2 mt-3"><button class="btn btn-primary btn-sm" data-action="copy-export">Copy JSON</button>${serverLink}</div>
      </div>
    </div>`;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (el.tagName === 'SELECT' || el.type === 'file' || a === 'pool-file') return;
  switch (a) {
    case 'theme': toggleTheme(); break;
    case 'setup-tab': app.setupTab = el.dataset.tab; renderSetup(); break;
    case 'dice': app.setup.seed = E.randomSeed(); renderSetup(); break;
    case 'clear-pool': app.customPool = null; renderSetup(); break;
    case 'start-local': startLocal(); break;
    case 'resume-local': resumeLocal(); break;
    case 'discard-local': LS.del(LOCAL_KEY); renderSetup(); break;
    case 'create-room': createRoom(); break;
    case 'join-room': joinRoom(); break;
    case 'claim': emit('team:claim', { teamId: el.dataset.team }); break;
    case 'release': emit('team:release'); break;
    case 'start-online': emit('draft:start'); break;
    case 'leave': leaveOnline(); break;
    case 'tab': setTab(el.dataset.tab); break;
    case 'pos': app.filters.pos = el.dataset.pos; app.limit = 150; renderChips(); renderPool(); $('#pool-wrap').scrollTop = 0; break;
    case 'more': app.limit += 150; renderPool(); break;
    case 'draft': draftPlayer(el.dataset.id); break;
    case 'show-team': app.viewTeam = el.dataset.team; renderRoster(); break;
    case 'pause':
      if (app.mode === 'local') { app.state.paused = !app.state.paused; afterLocal(); }
      else emit('draft:pause', { paused: !app.state.paused });
      break;
    case 'autopick':
      if (app.mode === 'local') localAuto('auto');
      else emit('draft:autopick');
      break;
    case 'undo':
      if (app.mode === 'local') {
        try { const pk = E.undoLastPick(app.state); app.state.paused = true; toast(`Undid ${player(pk.playerId).name}. Draft paused.`); afterLocal(); }
        catch (err) { toast(err.message, 'err'); }
      } else emit('draft:undo').then(r => { if (r.ok) toast('Last pick undone. Draft paused.'); });
      break;
    case 'new-draft':
      clearTimeout(app.botTimer); app.mode = null; app.state = null; app.screen = 'setup'; render(); break;
    case 'export': showExport(); break;
    case 'copy-export': {
      const ta = $('#export-text'); ta.select();
      const done = () => toast('Copied JSON');
      if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand('copy'); done(); } catch (x) { toast('Select the text and copy it', 'err'); } });
      else { try { document.execCommand('copy'); done(); } catch (x) { toast('Select the text and copy it', 'err'); } }
      break;
    }
    case 'close-modal': if (e.target === el || el.tagName === 'BUTTON') $('#overlay').innerHTML = ''; break;
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.nameIdx != null) { app.setup.names[Number(el.dataset.nameIdx)] = el.value; return; }
  if (el.dataset.bind) {
    const k = el.dataset.bind;
    const numeric = ['numTeams', 'humans', 'pickTimer', 'botDelay', 'onlineHumans'];
    app.setup[k] = numeric.indexOf(k) >= 0 ? Number(el.value) : el.value;
    if (k === 'joinCode') { el.value = el.value.toUpperCase(); app.setup.joinCode = el.value; }
    if (k === 'numTeams' && $('#numTeamsVal')) $('#numTeamsVal').textContent = el.value;
    return;
  }
  if (el.dataset.filter === 'q') { app.filters.q = el.value; app.limit = 150; renderPool(); }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.bind) {
    const st = app.setup;
    st.numTeams = E.clampInt(st.numTeams, 2, 32, 12);
    st.humans = E.clampInt(st.humans, 0, st.numTeams, 1);
    st.onlineHumans = E.clampInt(st.onlineHumans, 1, st.numTeams, 2);
    if (['numTeams', 'humans'].indexOf(el.dataset.bind) >= 0) renderSetup();
    return;
  }
  if (el.dataset.filter === 'team' || el.dataset.filter === 'sort') { app.filters[el.dataset.filter] = el.value; renderPool(); return; }
  if (el.dataset.filter === 'fit') { app.filters.fit = el.checked; renderPool(); return; }
  if (el.dataset.action === 'view-team') { app.viewTeam = el.value; renderRoster(); return; }
  if (el.dataset.action === 'pool-file' && el.files && el.files[0]) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const pool = E.normalizePool(JSON.parse(reader.result));
        const check = E.validatePool(pool, app.setup.numTeams);
        app.customPool = pool;
        renderSetup();
        toast(check.ok ? `Loaded ${pool.length} players` : `Loaded ${pool.length} players. Too few for ${app.setup.numTeams} teams: ${check.problems[0]}`, check.ok ? '' : 'err');
      } catch (err) { toast('Could not read that file: ' + err.message, 'err'); }
    };
    reader.readAsText(el.files[0]);
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#overlay').innerHTML) $('#overlay').innerHTML = '';
  if (e.key === '/' && app.screen === 'draft' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault(); const q = $('[data-filter="q"]'); if (q) q.focus();
  }
});

// ---------- Root render ----------
function render() {
  renderHeader();
  if (app.screen === 'setup') renderSetup();
  else if (app.screen === 'lobby') renderLobby();
  else { renderDraftShell(); app.lastOnClock = undefined; updateDraft(); }
}

setInterval(() => { if (app.screen === 'draft') renderTimer(); }, 250);

async function init() {
  setPool(PD.buildPool(), 'built-in');
  render();
  app.serverAvailable = await detectServer();
  const params = new URLSearchParams(location.search);
  const saved = LS.get(ONLINE_KEY);
  if (app.serverAvailable) {
    if (params.get('room')) { app.setup.joinCode = params.get('room').toUpperCase(); app.setupTab = 'online'; }
    if (saved && saved.room && (!params.get('room') || params.get('room').toUpperCase() === saved.room)) {
      app.mode = 'online'; app.room = saved.room; app.token = saved.token;
      connectSocket();
    }
  }
  if (app.screen === 'setup') renderSetup();
}
init();
})();
</script>
</body>
</html>
